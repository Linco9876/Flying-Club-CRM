[functions.trial-voucher-public]
verify_jwt = false

[functions.trial-voucher-admin]
verify_jwt = false

[functions.send-trial-voucher-email]
verify_jwt = false

[functions.create-trial-voucher-checkout]
verify_jwt = false

[functions.trial-voucher-stripe-webhook]
verify_jwt = false

[functions.xero-connect]
verify_jwt = false

[functions.xero-sync]
# Enforces AAL2 for administrators or the restricted integration worker secret internally.
verify_jwt = false

[functions.xero-webhook]
# Xero signs the exact raw request body with the separately stored webhook key.
verify_jwt = false

[functions.send-membership-welcome-email]
verify_jwt = false

[functions.member-xero-balance]
# The function validates the bearer token with Auth and enforces self/staff scope internally.
# Disabling the legacy gateway JWT check avoids valid modern sessions being rejected before that code runs.
verify_jwt = false

[functions.financial-provider-status]
# Returns only provider availability booleans needed by public signup and authenticated
# financial screens. Credentials and provider identifiers never leave the function.
verify_jwt = false

[functions.calendar-feed]
# Calendar clients and guest email links cannot send a Supabase JWT. Access is controlled
# with revocable, high-entropy bearer tokens and all data access runs through service role.
verify_jwt = false

[functions.integration-api]
# Authenticates versioned server-to-server API keys internally.
verify_jwt = false

[functions.integration-webhook-worker]
# Authenticates scheduled calls with INTEGRATION_WORKER_SECRET.
verify_jwt = false

[functions.address-autocomplete]
# Public membership applicants can search addresses before they have an account.
# The function only returns address suggestions and keeps provider credentials server-side.
verify_jwt = false

[functions.kiosk-access]
# Validates the high-entropy kiosk key itself for login. Admin management actions
# independently require a valid AAL2 administrator session.
verify_jwt = false
