name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Block dependency vulnerabilities
        run: npm run audit:dependencies
      - name: Enforce code-quality ratchet
        run: npm run quality:ratchet
      - name: Audit migration safety and ordering
        run: npm run audit:migrations:local
      - name: Build portal and PWAs
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Type-check every Edge Function
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            npx --yes deno check --node-modules-dir=false "$file"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print | sort)
      - name: Run every Edge Function unit test
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find supabase/functions -name '*.test.ts' -print | sort)
          test "${#tests[@]}" -gt 0
          npx --yes deno test --node-modules-dir=false "${tests[@]}"

  code-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
