name: CodeQL security scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 16 * * 0"

permissions:
  security-events: write
  packages: read
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
