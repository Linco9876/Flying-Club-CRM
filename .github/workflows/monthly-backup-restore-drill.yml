name: Monthly backup restore drill

on:
  schedule:
    - cron: "45 16 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-latest-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure OneDrive
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Download, decrypt and verify latest recovery point
        env:
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
          ONEDRIVE_BACKUP_PATH: ${{ secrets.ONEDRIVE_BACKUP_PATH }}
          BACKUP_AGE_PRIVATE_KEY: ${{ secrets.BACKUP_AGE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${RCLONE_REMOTE:-}"
          test -n "${ONEDRIVE_BACKUP_PATH:-}"
          test -n "${BACKUP_AGE_PRIVATE_KEY:-}"
          mkdir -p "$RUNNER_TEMP/recovery"
          latest="$(rclone lsf "$RCLONE_REMOTE:$ONEDRIVE_BACKUP_PATH" --files-only --include '*.tar.gz.age' | sort | tail -1)"
          test -n "$latest"
          rclone copyto "$RCLONE_REMOTE:$ONEDRIVE_BACKUP_PATH/$latest" "$RUNNER_TEMP/recovery/$latest"
          rclone copyto "$RCLONE_REMOTE:$ONEDRIVE_BACKUP_PATH/$latest.sha256" "$RUNNER_TEMP/recovery/$latest.sha256"
          cd "$RUNNER_TEMP/recovery"
          sha256sum -c "$latest.sha256"
          printf '%s\n' "$BACKUP_AGE_PRIVATE_KEY" > identity.txt
          chmod 600 identity.txt
          age -d -i identity.txt -o backup.tar.gz "$latest"
          tar -xzf backup.tar.gz
          backup_dir="$(find . -mindepth 1 -maxdepth 1 -type d -name 'backup-*' -print -quit)"
          test -n "$backup_dir"
          node "$GITHUB_WORKSPACE/scripts/verify-crm-backup.mjs" "$backup_dir"
          rm -f identity.txt backup.tar.gz "$latest"

  restore-isolated-database:
    needs: verify-latest-backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_RECOVERY_PROJECT_REF: ${{ secrets.SUPABASE_RECOVERY_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Restore encrypted database backup into isolated Supabase
        shell: pwsh
        run: |
          if (-not $env:SUPABASE_ACCESS_TOKEN) {
            throw 'SUPABASE_ACCESS_TOKEN is required.'
          }
          if (-not $env:SUPABASE_RECOVERY_PROJECT_REF) {
            throw 'SUPABASE_RECOVERY_PROJECT_REF is required.'
          }
          ./scripts/run-isolated-recovery-drill.ps1 `
            -RecoveryProjectRef $env:SUPABASE_RECOVERY_PROJECT_REF
