name: Configure Supabase runtime secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      INTEGRATION_WORKER_SECRET: ${{ secrets.INTEGRATION_WORKER_SECRET }}
      KIOSK_TOKEN_ENCRYPTION_KEY: ${{ secrets.KIOSK_TOKEN_ENCRYPTION_KEY }}
      TRIAL_VOUCHER_CRON_SECRET: ${{ secrets.TRIAL_VOUCHER_CRON_SECRET }}
      TRIAL_VOUCHER_INTERNAL_SECRET: ${{ secrets.TRIAL_VOUCHER_INTERNAL_SECRET }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Require runtime configuration
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"
          test -n "${BREVO_API_KEY:-}"
          test -n "${INTEGRATION_WORKER_SECRET:-}"
          test -n "${KIOSK_TOKEN_ENCRYPTION_KEY:-}"
          test -n "${TRIAL_VOUCHER_CRON_SECRET:-}"
          test -n "${TRIAL_VOUCHER_INTERNAL_SECRET:-}"

      - name: Configure recoverable Edge Function secrets
        run: |
          set -euo pipefail
          npx --yes supabase@latest secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            "PUBLIC_SITE_URL=https://portal.bendigoflyingclub.com.au" \
            "BREVO_API_KEY=$BREVO_API_KEY" \
            "BREVO_SENDER_EMAIL=no-reply@bendigoflyingclub.com.au" \
            "BREVO_SENDER_NAME=Bendigo Flying Club" \
            "INTEGRATION_WORKER_SECRET=$INTEGRATION_WORKER_SECRET" \
            "KIOSK_TOKEN_ENCRYPTION_KEY=$KIOSK_TOKEN_ENCRYPTION_KEY" \
            "TRIAL_VOUCHER_CRON_SECRET=$TRIAL_VOUCHER_CRON_SECRET" \
            "TRIAL_VOUCHER_INTERNAL_SECRET=$TRIAL_VOUCHER_INTERNAL_SECRET" \
            "XERO_RATE_LIMIT_PER_MINUTE=40" \
            "XERO_RATE_LIMIT_PER_DAY=4500" \
            "XERO_RATE_LIMIT_SPACING_MS=1300" \
            "XERO_RATE_LIMIT_MAX_WAIT_MS=30000"
